# Blueprint para Render (https://render.com/docs/blueprint-spec).
# Cria: banco PostgreSQL, serviço web (painel + demonstrações) e worker (automação em segundo plano).
# Verifique os planos/preços atuais no site da Render antes de criar. Preencha as variáveis "sync: false" no painel.
# Web e worker compartilham o MESMO grupo de variáveis (o AUTH_SECRET precisa ser idêntico nos dois).
envVarGroups:
  - name: sitehunter-shared
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - { key: ADMIN_USERNAME, sync: false }
      - { key: ADMIN_PASSWORD_HASH, sync: false }
      - { key: PUBLIC_BASE_URL, sync: false }
      - { key: GOOGLE_PLACES_API_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: ANTHROPIC_MODEL, value: claude-haiku-5-5 }
      - { key: VERCEL_TOKEN, sync: false }
      - { key: VERCEL_TEAM_ID, sync: false }
      - { key: WHATSAPP_ACCESS_TOKEN, sync: false }
      - { key: WHATSAPP_PHONE_NUMBER_ID, sync: false }
      - { key: WHATSAPP_APP_SECRET, sync: false }
      - { key: WHATSAPP_VERIFY_TOKEN, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASSWORD, sync: false }
      - { key: SMTP_FROM, sync: false }

databases:
  - name: sitehunter-db
    databaseName: sitehunter
    user: sitehunter

services:
  - type: web
    name: sitehunter-web
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sitehunter-db, property: connectionString }
      - fromGroup: sitehunter-shared
  - type: worker
    name: sitehunter-worker
    runtime: docker
    dockerCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sitehunter-db, property: connectionString }
      - fromGroup: sitehunter-shared
